[package]
name = "launcher-app"
edition.workspace = true
version.workspace = true

[lib]
name = "launcher"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
launcher-core = { path = "../core" }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["game-activity"] }
ndk = "0.9"
khronos-egl = { version = "6", features = ["static", "no-pkg-config"] }
glow = "0.18"
jni = "0.22"
libc = "0.2"
log = "0.4"
android_logger = "0.15"
